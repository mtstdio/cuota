<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cuota - Codex 配额管理与 5h 自动激活看板</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --purple: #a855f7;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 24px 16px;
    }
    .container { max-width: 1200px; margin: 0 auto; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    .title-group h1 { font-size: 1.5rem; font-weight: 700; color: var(--text); }
    .title-group p { font-size: 0.875rem; color: var(--text-muted); }
    .header-actions { display: flex; gap: 12px; align-items: center; }
    button {
      background: var(--primary);
      color: #0f172a;
      border: none;
      border-radius: 6px;
      padding: 8px 14px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    button:hover { background: var(--primary-hover); }
    button.btn-outline {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }
    button.btn-outline:hover { background: var(--border); }
    button.btn-sm { padding: 4px 10px; font-size: 0.75rem; }
    button.btn-warning { background: var(--warning); color: #000; }
    button.btn-danger { background: var(--danger); color: #fff; }

    /* Summary Metrics */
    .metrics {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 28px;
    }
    .metric-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
    }
    .metric-label { font-size: 0.8125rem; color: var(--text-muted); font-weight: 500; }
    .metric-value { font-size: 1.5rem; font-weight: 700; margin-top: 4px; }
    .metric-sub { font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; }

    /* Section Cards */
    .section-title {
      font-size: 1.125rem;
      font-weight: 600;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .card-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 32px; }
    .account-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      display: grid;
      grid-template-columns: 2fr 3fr 1.5fr;
      gap: 16px;
      align-items: center;
      transition: border-color 0.2s;
    }
    .account-card.active { border-left: 4px solid var(--success); }
    .account-card.cooldown { border-left: 4px solid var(--warning); }
    .account-card.disabled { opacity: 0.6; border-left: 4px solid var(--text-muted); }
    .account-card.error { border-left: 4px solid var(--danger); }

    .acct-info .acct-name { font-weight: 600; font-size: 1rem; display: flex; align-items: center; gap: 8px; }
    .acct-info .acct-email { font-size: 0.8125rem; color: var(--text-muted); word-break: break-all; }
    .acct-info .acct-plan { font-size: 0.75rem; color: var(--primary); margin-top: 2px; }

    .badge {
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 600;
      text-transform: uppercase;
    }
    .badge-active { background: rgba(16, 185, 129, 0.2); color: #34d399; }
    .badge-ready { background: rgba(56, 189, 248, 0.2); color: #38bdf8; }
    .badge-cooldown { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
    .badge-disabled { background: rgba(148, 163, 184, 0.2); color: #94a3b8; }
    .badge-error { background: rgba(239, 68, 68, 0.2); color: #f87171; }

    /* Quota Bars */
    .bars { display: flex; flex-direction: column; gap: 8px; }
    .bar-row { display: flex; flex-direction: column; gap: 2px; }
    .bar-meta { display: flex; justify-content: space-between; font-size: 0.75rem; }
    .bar-meta .time { color: var(--warning); font-weight: 600; }
    .progress-bg {
      height: 8px;
      background: #0f172a;
      border-radius: 4px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.3s;
    }
    .fill-good { background: var(--success); }
    .fill-mid { background: var(--warning); }
    .fill-danger { background: var(--danger); }

    .acct-actions { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
    .btn-group { display: flex; gap: 6px; }

    /* Probe History Table */
    .table-container {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow-x: auto;
    }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.8125rem; }
    th { background: #0f172a; padding: 10px 14px; color: var(--text-muted); font-weight: 600; border-bottom: 1px solid var(--border); }
    td { padding: 10px 14px; border-bottom: 1px solid rgba(51, 65, 85, 0.5); }
    tr:last-child td { border-bottom: none; }

    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 18px;
      border-radius: 6px;
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5);
      display: none;
      z-index: 1000;
    }

    @media (max-width: 768px) {
      .account-card { grid-template-columns: 1fr; gap: 12px; }
      .acct-actions { align-items: flex-start; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="title-group">
        <h1>Cuota Codex 配额管家</h1>
        <p>5h 额度自动探测激活 · Fill-First 智能无缝切换 · CPA 动态协调</p>
      </div>
      <div class="header-actions">
        <span id="lastRefreshed" style="font-size: 0.75rem; color: var(--text-muted);">更新中...</span>
        <button id="btnRefresh" class="btn-outline">🔄 立即刷新</button>
      </div>
    </header>

    <!-- Metrics -->
    <div class="metrics">
      <div class="metric-card">
        <div class="metric-label">当前主力活跃账号</div>
        <div class="metric-value" id="valActive" style="color: var(--success);">--</div>
        <div class="metric-sub">CPA 最高优先级分发中</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">可用账号池 / 就绪</div>
        <div class="metric-value" id="valReady" style="color: var(--primary);">0</div>
        <div class="metric-sub">备用就绪账号数</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">冷却中 (等待 5h 重置)</div>
        <div class="metric-value" id="valCooldown" style="color: var(--warning);">0</div>
        <div class="metric-sub">到期将自动 Probe 激活</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">账号总数</div>
        <div class="metric-value" id="valTotal">0</div>
        <div class="metric-sub">受管理的 Codex 凭据</div>
      </div>
    </div>

    <!-- Accounts -->
    <div class="section-title">
      <span>账号配额与状态</span>
      <span style="font-size: 0.8125rem; color: var(--text-muted); font-weight: normal;">自动保持 Fill-First 轮换</span>
    </div>
    <div class="card-list" id="accountList">
      <div style="text-align: center; padding: 40px; color: var(--text-muted);">正在加载账号状态...</div>
    </div>

    <!-- Probe Logs -->
    <div class="section-title">
      <span>5h 额度自动激活流水 (Probe Ping)</span>
      <span style="font-size: 0.8125rem; color: var(--text-muted); font-weight: normal;">消耗极微量 Token 触发倒计时</span>
    </div>
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>时间</th>
            <th>账号</th>
            <th>状态</th>
            <th>响应耗时</th>
            <th>详情</th>
          </tr>
        </thead>
        <tbody id="probeTableBody">
          <tr><td colspan="5" style="text-align: center; color: var(--text-muted);">暂无激活流水记录</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 3000);
    }

    function formatCountdown(targetDateStr) {
      if (!targetDateStr || targetDateStr.startsWith('0001-01-01')) return '';
      const target = new Date(targetDateStr);
      const now = new Date();
      const diff = target - now;
      if (diff <= 0) return '已到期（即将激活）';
      const hours = Math.floor(diff / 3600000);
      const mins = Math.floor((diff % 3600000) / 60000);
      const secs = Math.floor((diff % 60000) / 1000);
      return `${String(hours).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    async function fetchStatus() {
      try {
        const res = await fetch('/api/status');
        if (!res.ok) throw new Error('网络请求异常');
        const data = await res.json();
        renderDashboard(data);
      } catch (e) {
        console.error(e);
      }
    }

    function renderDashboard(data) {
      document.getElementById('lastRefreshed').textContent = '更新于 ' + new Date().toLocaleTimeString();

      const activeID = data.active_id || '--';
      document.getElementById('valActive').textContent = activeID;

      const accounts = data.accounts || [];
      document.getElementById('valTotal').textContent = accounts.length;

      let readyCount = 0;
      let cooldownCount = 0;
      accounts.forEach(a => {
        if (a.state === 'ready') readyCount++;
        if (a.state === 'cooldown') cooldownCount++;
      });
      document.getElementById('valReady').textContent = readyCount;
      document.getElementById('valCooldown').textContent = cooldownCount;

      renderAccounts(accounts, activeID);
      renderProbeLogs(data.probe_logs || []);
    }

    function renderAccounts(accounts, activeID) {
      const container = document.getElementById('accountList');
      if (accounts.length === 0) {
        container.innerHTML = '<div style="text-align: center; padding: 40px; color: var(--text-muted);">暂无配置的 Codex 账号，请检查 auth-dir 或 CPA 配置</div>';
        return;
      }

      container.innerHTML = accounts.map(item => {
        const acct = item.account || {};
        const q = item.quota || {};
        const state = item.state || 'ready';
        const isActive = acct.id === activeID;

        // 5h Quota
        let fiveHourUsed = 0;
        let fiveHourReset = '';
        if (q.five_hour) {
          fiveHourUsed = q.five_hour.used_percent || 0;
          fiveHourReset = q.five_hour.reset_at;
        }
        const fiveHourRem = Math.max(0, 100 - fiveHourUsed).toFixed(1);
        const countdownStr = formatCountdown(fiveHourReset);

        // Weekly Quota
        let weeklyUsed = 0;
        if (q.weekly) {
          weeklyUsed = q.weekly.used_percent || 0;
        }
        const weeklyRem = Math.max(0, 100 - weeklyUsed).toFixed(1);

        const fillClass = fiveHourRem > 40 ? 'fill-good' : fiveHourRem > 15 ? 'fill-mid' : 'fill-danger';

        let badgeClass = 'badge-ready';
        let badgeText = '待命就绪';
        if (state === 'active') { badgeClass = 'badge-active'; badgeText = '主力运行中'; }
        else if (state === 'cooldown') { badgeClass = 'badge-cooldown'; badgeText = '冷却中'; }
        else if (state === 'disabled') { badgeClass = 'badge-disabled'; badgeText = '已停用'; }
        else if (state === 'error') { badgeClass = 'badge-error'; badgeText = '异常'; }

        return `
          <div class="account-card ${state} ${isActive ? 'active' : ''}">
            <div class="acct-info">
              <div class="acct-name">
                <span>${acct.id}</span>
                <span class="badge ${badgeClass}">${badgeText}</span>
              </div>
              <div class="acct-email">${acct.email || (acct.chatgpt_account_id ? 'ID: ' + acct.chatgpt_account_id : acct.file_name)}</div>
              <div class="acct-plan">${q.plan_type ? q.plan_type.toUpperCase() : 'CODEX'} · 优先级: ${acct.priority}</div>
              <div style="font-size: 0.75rem; color: var(--text-muted); margin-top: 4px;">${item.state_desc || ''}</div>
            </div>

            <div class="bars">
              <div class="bar-row">
                <div class="bar-meta">
                  <span>5h 额度剩余: <strong>${fiveHourRem}%</strong></span>
                  ${countdownStr ? `<span class="time">倒计时: ${countdownStr}</span>` : '<span>倒计时未开始</span>'}
                </div>
                <div class="progress-bg">
                  <div class="progress-fill ${fillClass}" style="width: ${fiveHourRem}%;"></div>
                </div>
              </div>
              <div class="bar-row">
                <div class="bar-meta">
                  <span style="color: var(--text-muted);">周额度剩余: ${weeklyRem}%</span>
                </div>
                <div class="progress-bg">
                  <div class="progress-fill" style="width: ${weeklyRem}%; background: var(--purple);"></div>
                </div>
              </div>
            </div>

            <div class="acct-actions">
              <div class="btn-group">
                <button class="btn-sm btn-outline" onclick="triggerProbe('${acct.id}')" title="发送微量 ping 触发 5h 重置倒计时">⚡ 激活Probe</button>
                ${!isActive && state !== 'disabled' ? `<button class="btn-sm" onclick="setActiveAccount('${acct.id}')">★ 设为主力</button>` : ''}
              </div>
              <div class="btn-group" style="margin-top: 4px;">
                <button class="btn-sm ${acct.disabled ? 'btn-outline' : 'btn-danger'}" onclick="toggleAccount('${acct.id}', ${!acct.disabled})">
                  ${acct.disabled ? '启用账号' : '停用账号'}
                </button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function renderProbeLogs(logs) {
      const tbody = document.getElementById('probeTableBody');
      if (logs.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: var(--text-muted);">暂无激活流水记录</td></tr>';
        return;
      }

      tbody.innerHTML = logs.slice(0, 20).map(log => {
        const timeStr = new Date(log.timestamp).toLocaleTimeString();
        const badge = log.success ? '<span class="badge badge-active">成功</span>' : '<span class="badge badge-error">失败</span>';
        const durationMs = Math.round(log.duration_ms / 1000000);
        return `
          <tr>
            <td>${timeStr}</td>
            <td><strong>${log.account_id}</strong></td>
            <td>${badge} (${log.status})</td>
            <td>${durationMs} ms</td>
            <td>${log.message || '--'}</td>
          </tr>
        `;
      }).join('');
    }

    async function triggerProbe(id) {
      try {
        showToast('正在发送 5h 激活探测 ping...');
        const res = await fetch('/api/probe', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ account_id: id })
        });
        const data = await res.json();
        showToast(data.message || '探测指令已完成');
        fetchStatus();
      } catch (e) {
        showToast('探测失败: ' + e.message);
      }
    }

    async function setActiveAccount(id) {
      try {
        showToast('正在切换主力账号...');
        const res = await fetch('/api/switch', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ account_id: id })
        });
        const data = await res.json();
        showToast(data.message || '切换成功');
        fetchStatus();
      } catch (e) {
        showToast('切换失败: ' + e.message);
      }
    }

    async function toggleAccount(id, disabled) {
      try {
        const res = await fetch('/api/account/toggle', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ account_id: id, disabled: disabled })
        });
        const data = await res.json();
        showToast(data.message || '更新成功');
        fetchStatus();
      } catch (e) {
        showToast('操作失败: ' + e.message);
      }
    }

    document.getElementById('btnRefresh').addEventListener('click', async () => {
      showToast('正在同步最新配额...');
      await fetch('/api/refresh', { method: 'POST' });
      fetchStatus();
    });

    // 初始加载与每 5 秒轮询更新界面
    fetchStatus();
    setInterval(fetchStatus, 5000);
  </script>
</body>
</html>
